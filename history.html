<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Cost History</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f1117;color:#e2e8f0;padding:2rem}
.header{padding-bottom:1rem;border-bottom:1px solid #2d3748;margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem}
.back-link{font-size:13px;color:#63b3ed;text-decoration:none;display:flex;align-items:center;gap:4px}
.back-link:hover{text-decoration:underline}
.header-title{font-size:22px;font-weight:500;color:#f7fafc}
.header-sub{font-size:13px;color:#a0aec0;margin-top:4px}
.section-title{font-size:15px;font-weight:500;color:#f7fafc;margin-bottom:1rem}
.chart-wrap{background:#1a202c;border:1px solid #2d3748;border-radius:8px;padding:1.5rem;margin-bottom:2rem}
.month-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:2rem}
.month-card{background:#1a202c;border:1px solid #2d3748;border-radius:8px;padding:1rem;cursor:pointer}
.month-card:hover{border-color:#4a5568}
.month-card.active{border-color:#378ADD}
.month-label{font-size:13px;color:#a0aec0;margin-bottom:4px}
.month-amount{font-size:20px;font-weight:500;color:#f7fafc}
.month-detail{margin-top:2rem;display:none}
.month-detail.open{display:block}
.detail-title{font-size:15px;font-weight:500;color:#f7fafc;margin-bottom:1rem}
.service-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2d3748}
.service-row:last-child{border-bottom:none}
.service-name{font-size:14px;color:#e2e8f0;flex:1}
.service-bar-wrap{flex:2;height:6px;background:#2d3748;border-radius:3px;overflow:hidden}
.service-bar{height:100%;border-radius:3px;background:#378ADD}
.service-cost{font-size:13px;color:#a0aec0;min-width:60px;text-align:right}
.comparison-section{margin-top:2rem}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.compare-card{background:#1a202c;border:1px solid #2d3748;border-radius:8px;padding:1rem}
.compare-label{font-size:12px;color:#a0aec0;margin-bottom:8px}
.compare-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #2d3748}
.compare-row:last-child{border-bottom:none}
.compare-service{color:#e2e8f0}
.compare-amount{color:#a0aec0}
.up{color:#fc8181}
.down{color:#68d391}
.legend{display:flex;gap:16px;margin-bottom:8px;font-size:12px;color:#a0aec0}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}
</style>
</head>
<body>

<div class="header">
  <div>
    <a class="back-link" href="cloud.html"><i class="ti ti-arrow-left"></i> Back to dashboard</a>
    <div class="header-title" style="margin-top:8px">Past data &amp; comparisons</div>
    <div class="header-sub">Month-wise spending history</div>
  </div>
</div>

<div class="chart-wrap">
  <div class="section-title">Total spend — all months</div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#378ADD"></span>Monthly spend</span>
    <span><span class="legend-dot" style="background:#f6ad55"></span>Budget limit</span>
  </div>
  <div style="position:relative;height:260px">
    <canvas id="monthlyChart" role="img" aria-label="Bar chart showing monthly AWS spend vs budget limit">Monthly spend data loading...</canvas>
  </div>
</div>

<div class="section-title">Click a month to see service breakdown</div>
<div class="month-grid" id="month-grid">
  <div style="font-size:13px;color:#a0aec0">Loading...</div>
</div>

<div class="month-detail" id="month-detail">
  <div class="detail-title" id="detail-title">Service breakdown</div>
  <div id="detail-services"></div>
</div>

<div class="comparison-section">
  <div class="section-title">This month vs last month</div>
  <div class="compare-grid" id="compare-grid">
    <div style="font-size:13px;color:#a0aec0">Loading comparison...</div>
  </div>
</div>

<script>
const BUCKET_URL = 'https://cost-monitor-dashboard-priyal.s3.ap-south-1.amazonaws.com';
let historyData = [];

async function loadHistory() {
  try {
    const res = await fetch(BUCKET_URL + '/history.json');
    historyData = await res.json();
    renderAll();
  } catch(e) {
    document.getElementById('month-grid').innerHTML = '<div style="font-size:13px;color:#a0aec0">Could not load history. Check S3 bucket and CORS settings.</div>';
  }
}

function groupByMonth(data) {
  const months = {};
  data.forEach(item => {
    const month = item.date.slice(0, 7);
    if (!months[month]) months[month] = { spend: 0, limit: item.budget_limit || 5, services: item.service_breakdown || {}, date: month };
    months[month].spend = Math.max(months[month].spend, item.spend_amount || 0);
    months[month].services = item.service_breakdown || {};
  });
  return Object.values(months).sort((a, b) => a.date.localeCompare(b.date));
}

function renderAll() {
  const months = groupByMonth(historyData);
  renderChart(months);
  renderMonthCards(months);
  renderComparison(months);
}

function renderChart(months) {
  const labels = months.map(m => {
    const [y, mo] = m.date.split('-');
    return new Date(y, mo - 1).toLocaleString('default', { month: 'short', year: '2-digit' });
  });
  new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { 
          type: 'bar',
          label: 'Spend', 
          data: months.map(m => parseFloat(m.spend.toFixed(4))), 
          backgroundColor: '#378ADD', 
          borderRadius: 4,
          order: 2
        },
        { 
          type: 'line',
          label: 'Budget limit', 
          data: months.map(m => parseFloat(m.budget_limit || m.limit || 0)),
          borderColor: '#f6ad55', 
          backgroundColor: 'transparent',
          borderWidth: 2, 
          pointRadius: 4,
          pointBackgroundColor: '#f6ad55',
          tension: 0.1,
          order: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#a0aec0', autoSkip: false }, grid: { color: '#2d3748' } },
        y: { ticks: { color: '#a0aec0', callback: v => '$' + v }, grid: { color: '#2d3748' } }
      }
    }
  });
}

function renderMonthCards(months) {
  const grid = document.getElementById('month-grid');
  grid.innerHTML = months.map((m, i) => {
    const [y, mo] = m.date.split('-');
    const label = new Date(y, mo - 1).toLocaleString('default', { month: 'long', year: 'numeric' });
    return `<div class="month-card" id="mcard-${i}" onclick="showMonthDetail(${i})">
      <div class="month-label">${label}</div>
      <div class="month-amount">$${m.spend.toFixed(2)}</div>
    </div>`;
  }).join('');
}

function showMonthDetail(i) {
  const months = groupByMonth(historyData);
  const m = months[i];
  const [y, mo] = m.date.split('-');
  const label = new Date(y, mo - 1).toLocaleString('default', { month: 'long', year: 'numeric' });

  document.querySelectorAll('.month-card').forEach(c => c.classList.remove('active'));
  document.getElementById('mcard-' + i).classList.add('active');

  const detail = document.getElementById('month-detail');
  const services = m.services || {};
  const entries = Object.entries(services).filter(([,v]) => parseFloat(v) > 0).sort((a,b) => parseFloat(b[1]) - parseFloat(a[1]));
  const maxCost = entries.length ? parseFloat(entries[0][1]) : 1;

  document.getElementById('detail-title').textContent = label + ' — service breakdown';
  document.getElementById('detail-services').innerHTML = entries.length ? entries.map(([name, cost]) => {
    const c = parseFloat(cost);
    return `<div class="service-row">
      <span class="service-name">${name}</span>
      <div class="service-bar-wrap"><div class="service-bar" style="width:${(c/maxCost*100).toFixed(1)}%"></div></div>
      <span class="service-cost">$${c.toFixed(4)}</span>
    </div>`;
  }).join('') : '<div style="font-size:13px;color:#a0aec0">No service data for this month.</div>';

  detail.classList.add('open');
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderComparison(months) {
  if (months.length < 2) {
    document.getElementById('compare-grid').innerHTML = '<div style="font-size:13px;color:#a0aec0">Need at least 2 months of data for comparison.</div>';
    return;
  }
  const curr = months[months.length - 1];
  const prev = months[months.length - 2];
  const [cy, cm] = curr.date.split('-');
  const [py, pm] = prev.date.split('-');
  const currLabel = new Date(cy, cm - 1).toLocaleString('default', { month: 'long' });
  const prevLabel = new Date(py, pm - 1).toLocaleString('default', { month: 'long' });

  const allServices = new Set([...Object.keys(curr.services), ...Object.keys(prev.services)]);
  const rows = [...allServices].map(s => {
    const c = parseFloat(curr.services[s] || 0);
    const p = parseFloat(prev.services[s] || 0);
    const diff = c - p;
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '—';
    const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
    return { s, c, p, diff, arrow, cls };
  }).filter(r => r.c > 0 || r.p > 0).sort((a, b) => b.c - a.c);

  document.getElementById('compare-grid').innerHTML = `
    <div class="compare-card">
      <div class="compare-label">${currLabel} (this month)</div>
      ${rows.map(r => `<div class="compare-row"><span class="compare-service">${r.s}</span><span class="compare-amount">$${r.c.toFixed(4)}</span></div>`).join('')}
      <div class="compare-row" style="margin-top:8px"><span style="font-weight:500;color:#f7fafc">Total</span><span style="font-weight:500;color:#f7fafc">$${curr.spend.toFixed(2)}</span></div>
    </div>
    <div class="compare-card">
      <div class="compare-label">${prevLabel} (last month)</div>
      ${rows.map(r => `<div class="compare-row"><span class="compare-service">${r.s}</span><span class="compare-amount ${r.cls}">${r.arrow} $${r.p.toFixed(4)}</span></div>`).join('')}
      <div class="compare-row" style="margin-top:8px"><span style="font-weight:500;color:#f7fafc">Total</span><span style="font-weight:500;color:#f7fafc">$${prev.spend.toFixed(2)}</span></div>
    </div>`;
}

loadHistory();
</script>
</body>
</html>
